<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>On3 College Football TV Ratings Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #E91518;
    --secondary: #FFFFFF;
    --bg: #0E0E10;
    --surface: #19191C;
    --surface-2: #212124;
    --border: #2E2E32;
    --text: #F4F4F5;
    --text-dim: #A2A2A8;
    --font-display: 'Barlow Condensed', sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
  }
  [data-theme="light"] {
    --bg: #F5F5F6;
    --surface: #FFFFFF;
    --surface-2: #F0F0F1;
    --border: #E1E1E3;
    --text: #17171A;
    --text-dim: #6B6B72;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }

  header.page-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
    border-bottom: 3px solid var(--primary);
    padding-bottom: 16px;
  }
  .title-block .eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--primary); margin: 0 0 4px;
  }
  h1 {
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(26px, 5vw, 38px); line-height: 1.02; margin: 0; letter-spacing: -0.01em;
  }
  .theme-toggle {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0;
  }
  .theme-toggle:hover { border-color: var(--primary); }

  .status-banner {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-banner.error { color: var(--primary); }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #3FD68A; flex-shrink: 0;
  }
  .status-banner.error .status-dot { background: var(--primary); }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  @media (min-width: 640px) { .controls { flex-wrap: nowrap; } }
  .search-box { flex: 1 1 120px; max-width: 170px; position: relative; }
  .search-box input {
    width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 6px 8px 6px 26px; border-radius: 8px; font-size: 12px;
  }
  .search-box::before {
    content: ""; position: absolute; left: 9px; top: 50%; width: 10px; height: 10px;
    transform: translateY(-50%); border: 2px solid var(--text-dim); border-radius: 50%; pointer-events: none;
  }
  .search-box::after {
    content: ""; position: absolute; left: 16px; top: 60%; width: 5px; height: 2px;
    background: var(--text-dim); transform: rotate(45deg); pointer-events: none;
  }
  select {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 6px 7px; border-radius: 8px; font-size: 11px; cursor: pointer;
  }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  thead th {
    text-align: left; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-dim); padding: 12px 14px; background: var(--surface-2); border-bottom: 1px solid var(--border);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:hover { color: var(--primary); }
  thead th .arrow { margin-left: 4px; opacity: 0.5; font-size: 10px; }
  thead th.active .arrow { opacity: 1; color: var(--primary); }
  tbody td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-2); }
  td.col-viewers { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--primary); white-space: nowrap; }
  td.col-game { font-weight: 600; }
  .net-badge {
    display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700;
    letter-spacing: 0.03em; border: 1px solid var(--nc, var(--border)); color: var(--nc, var(--text));
    background: color-mix(in srgb, var(--nc, var(--text-dim)) 12%, transparent); white-space: nowrap; margin: 2px 4px 2px 0;
  }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 14px; display: none; }
  footer.page-foot { margin-top: 22px; text-align: center; font-size: 12px; color: var(--text-dim); letter-spacing: 0.02em; }

  .card-list { display: none; }
  @media (max-width: 720px) {
    table { display: none; }
    .card-list { display: block; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 14px 12px; margin-bottom: 10px; width: 100%; max-width: 100%; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .card-game { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
    .card-viewers { font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--primary); white-space: nowrap; flex-shrink: 0; text-align: right; }
    .card-viewers small { display: block; font-family: var(--font-body); font-size: 9px; font-weight: 600; letter-spacing: 0.06em; color: var(--text-dim); text-transform: uppercase; }
    .card-bottom { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px; color: var(--text-dim); border-top: 1px solid var(--border); padding-top: 9px; }
    .card-bottom .dot { opacity: 0.5; }
  }
</style>
</head>
<body data-theme="dark">
<div class="wrap">

  <header class="page-head">
    <div class="title-block">
      <p class="eyebrow">2025 Season &middot; Live Tracker</p>
      <h1>On3 College Football<br>TV Ratings Tracker</h1>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-pressed="true">
      <span id="themeIcon">&#9789;</span> <span id="themeLabel">Dark</span>
    </button>
  </header>

  <div class="status-banner" id="statusBanner">
    <span class="status-dot"></span> <span id="statusText">Loading latest data&hellip;</span>
  </div>

  <div class="controls">
    <div class="search-box"><input type="text" id="searchInput" placeholder="Search by team..."></div>
    <select id="weekFilter" aria-label="Filter by week"><option value="all">All Weeks</option></select>
    <select id="networkFilter" aria-label="Filter by network"><option value="all">All Networks</option></select>
    <select id="phaseFilter" aria-label="Filter by phase"><option value="all">All Phases</option></select>
  </div>

  <table>
    <thead>
      <tr>
        <th data-sort="viewers" data-type="num">Viewers <span class="arrow">&#9660;</span></th>
        <th data-sort="game" data-type="str">Game <span class="arrow">&#9660;</span></th>
        <th data-sort="datetime" data-type="str">Date / Time <span class="arrow">&#9660;</span></th>
        <th data-sort="network" data-type="str">Network <span class="arrow">&#9660;</span></th>
        <th data-sort="week" data-type="str">Week <span class="arrow">&#9660;</span></th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <div class="card-list" id="cardList"></div>
  <div class="empty-state" id="emptyState">No games match your filters.</div>

  <footer class="page-foot">Source: Nielsen Big Data + Panel</footer>
</div>

<script>
/* ============================================================
   CONFIG — paste your published Google Sheet CSV link here.
   How to get it:
   1. In Google Sheets: File > Share > Publish to web
   2. Choose the specific sheet/tab, format: Comma-separated values (.csv)
   3. Click Publish, copy the link it gives you, paste below.
   Your sheet's header row (first row) must read exactly:
   Viewers,Game,Date/Time,Network,Week,Phase
   ============================================================ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQRv4T6Ec34Y1Zr1SUJKptiTq7MkgyUzlxc36KoKrt1XP7pXiCeRg_2Sy7oGeNgFROcrieMlVmZkD62/pub?gid=0&single=true&output=csv";
const REFRESH_INTERVAL_MS = 5 * 60 * 1000; // re-check every 5 minutes

const WEEK_ORDER = ['Week 1','Week 2','Week 3','Week 4','Week 5','Week 6','Week 7','Week 8','Week 9','Week 10','Week 11','Week 12','Week 13','Week 14','Week 15','Week 16','Week 17','Conference Championships','Army-Navy','Bowl Games','College Football Playoff'];

const NETWORK_COLORS = {
  "ABC": "#5E9CFF", "ESPN": "#E91518", "ESPN2": "#FF7A59", "ESPNU": "#FFB84D",
  "FOX": "#3B6EF6", "FS1": "#1A4FD1", "NBC": "#B15CFF", "CBS": "#4DA6FF",
  "BTN": "#8A8AFF", "TNT": "#FFC94D", "The CW": "#3FD1A6", "TBS": "#FF8FA3", "truTV": "#5FD68A"
};

let DATA = [];
let sortState = { key: "viewers", dir: "desc" };
let filters = { search: "", week: "all", network: "all", phase: "all" };

// Minimal CSV parser that handles quoted fields (Google's export quotes any field containing a comma)
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else { field += c; }
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length === 1 && r[0] !== ''));
}

async function loadData() {
  const statusBanner = document.getElementById('statusBanner');
  const statusText = document.getElementById('statusText');
  try {
    if (!SHEET_CSV_URL || SHEET_CSV_URL.indexOf('PASTE_YOUR') === 0) {
      throw new Error('Sheet link not configured yet');
    }
    const res = await fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + 'cachebust=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    const header = rows[0].map(h => h.trim().toLowerCase());
    const idx = {
      viewers: header.indexOf('viewers'),
      game: header.indexOf('game'),
      datetime: header.indexOf('date/time'),
      network: header.indexOf('network'),
      week: header.indexOf('week'),
      phase: header.indexOf('phase')
    };
    DATA = rows.slice(1)
      .filter(r => r[idx.game] && r[idx.game].trim())
      .map(r => ({
        viewers: parseFloat(r[idx.viewers]) || 0,
        game: (r[idx.game] || '').trim(),
        datetime: (r[idx.datetime] || '').trim(),
        network: (r[idx.network] || '').trim(),
        week: (r[idx.week] || '').trim(),
        phase: (r[idx.phase] || '').trim()
      }));

    statusBanner.classList.remove('error');
    statusText.textContent = 'Live — synced ' + new Date().toLocaleTimeString();
  } catch (e) {
    statusBanner.classList.add('error');
    statusText.textContent = 'Could not load live data (' + e.message + ') — check SHEET_CSV_URL in the page source';
  }
  refreshFilterOptions();
  render();
}

function refreshFilterOptions() {
  const weekSel = document.getElementById('weekFilter');
  const netSel = document.getElementById('networkFilter');
  const phaseSel = document.getElementById('phaseFilter');
  const prevWeek = weekSel.value, prevNet = netSel.value, prevPhase = phaseSel.value;
  weekSel.innerHTML = '<option value="all">All Weeks</option>';
  netSel.innerHTML = '<option value="all">All Networks</option>';
  phaseSel.innerHTML = '<option value="all">All Phases</option>';

  const weeksPresent = new Set(DATA.map(d => d.week));
  const orderedWeeks = WEEK_ORDER.filter(w => weeksPresent.has(w));
  [...weeksPresent].filter(w => !WEEK_ORDER.includes(w)).sort().forEach(w => orderedWeeks.push(w));
  orderedWeeks.forEach(w => {
    const opt = document.createElement('option'); opt.value = w; opt.textContent = w; weekSel.appendChild(opt);
  });

  const allNets = new Set();
  DATA.forEach(d => d.network.split('/').forEach(n => allNets.add(n.trim())));
  [...allNets].filter(Boolean).sort().forEach(n => {
    const opt = document.createElement('option'); opt.value = n; opt.textContent = n; netSel.appendChild(opt);
  });

  [...new Set(DATA.map(d => d.phase))].filter(Boolean).sort().forEach(p => {
    const opt = document.createElement('option'); opt.value = p; opt.textContent = p; phaseSel.appendChild(opt);
  });

  weekSel.value = [...weekSel.options].some(o => o.value === prevWeek) ? prevWeek : 'all';
  netSel.value = [...netSel.options].some(o => o.value === prevNet) ? prevNet : 'all';
  phaseSel.value = [...phaseSel.options].some(o => o.value === prevPhase) ? prevPhase : 'all';
}

function getFiltered() {
  return DATA.filter(d => {
    const matchesSearch = d.game.toLowerCase().includes(filters.search.toLowerCase());
    const matchesWeek = filters.week === 'all' || d.week === filters.week;
    const matchesNetwork = filters.network === 'all' || d.network.split('/').map(n => n.trim()).includes(filters.network);
    const matchesPhase = filters.phase === 'all' || d.phase === filters.phase;
    return matchesSearch && matchesWeek && matchesNetwork && matchesPhase;
  });
}

function getSorted(rows) {
  const { key, dir } = sortState;
  return [...rows].sort((a, b) => {
    let av = a[key], bv = b[key];
    if (typeof av === 'string') { av = av.toLowerCase(); bv = bv.toLowerCase(); }
    if (av < bv) return dir === 'asc' ? -1 : 1;
    if (av > bv) return dir === 'asc' ? 1 : -1;
    return 0;
  });
}

function netBadge(network) {
  return network.split('/').map(n => {
    n = n.trim();
    const color = NETWORK_COLORS[n] || '#A2A2A8';
    return `<span class="net-badge" style="--nc:${color}">${n}</span>`;
  }).join(' ');
}

function render() {
  const rows = getSorted(getFiltered());
  const tbody = document.getElementById('tableBody');
  const cardList = document.getElementById('cardList');
  const emptyState = document.getElementById('emptyState');
  emptyState.style.display = rows.length ? 'none' : 'block';

  tbody.innerHTML = rows.map(d => `
    <tr>
      <td class="col-viewers">${d.viewers} M</td>
      <td class="col-game">${d.game}</td>
      <td>${d.datetime}</td>
      <td>${netBadge(d.network)}</td>
      <td>${d.week}</td>
    </tr>
  `).join('');

  cardList.innerHTML = rows.map(d => `
    <div class="card">
      <div class="card-top">
        <div class="card-game">${d.game}</div>
        <div class="card-viewers"><small>Viewers</small>${d.viewers} M</div>
      </div>
      <div class="card-bottom">
        <span>${d.datetime}</span>
        <span class="dot">&bull;</span>
        <span>${d.week}</span>
        <span class="dot">&bull;</span>
        <span>${netBadge(d.network)}</span>
      </div>
    </div>
  `).join('');

  document.querySelectorAll('th[data-sort]').forEach(th => {
    th.classList.toggle('active', th.dataset.sort === sortState.key);
    const arrow = th.querySelector('.arrow');
    if (!arrow) return;
    if (th.dataset.sort === sortState.key) {
      arrow.innerHTML = sortState.dir === 'asc' ? '&#9650;' : '&#9660;';
    } else {
      arrow.innerHTML = '&#9660;';
    }
  });
}

document.querySelectorAll('th[data-sort]').forEach(th => {
  th.tabIndex = 0;
  const handler = () => {
    const key = th.dataset.sort;
    if (sortState.key === key) {
      sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
    } else {
      sortState = { key, dir: th.dataset.type === 'num' ? 'desc' : 'asc' };
    }
    render();
  };
  th.addEventListener('click', handler);
  th.addEventListener('keypress', e => { if (e.key === 'Enter') handler(); });
});

document.getElementById('searchInput').addEventListener('input', e => { filters.search = e.target.value; render(); });
document.getElementById('weekFilter').addEventListener('change', e => { filters.week = e.target.value; render(); });
document.getElementById('networkFilter').addEventListener('change', e => { filters.network = e.target.value; render(); });
document.getElementById('phaseFilter').addEventListener('change', e => { filters.phase = e.target.value; render(); });

const themeToggle = document.getElementById('themeToggle');
const themeIcon = document.getElementById('themeIcon');
const themeLabel = document.getElementById('themeLabel');
themeToggle.addEventListener('click', () => {
  const body = document.body;
  const isDark = body.getAttribute('data-theme') === 'dark';
  body.setAttribute('data-theme', isDark ? 'light' : 'dark');
  themeIcon.innerHTML = isDark ? '&#9728;' : '&#9789;';
  themeLabel.textContent = isDark ? 'Light' : 'Dark';
});

loadData();
setInterval(loadData, REFRESH_INTERVAL_MS);
</script>
</body>
</html>
